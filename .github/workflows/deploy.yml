name: Deploy Wunschliste to Burkerserver

on:
  workflow_run:
    workflows: ["CI - Qualität & Tests"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-wunschliste
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy auf Burkerserver
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: self-hosted
    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🐍 CI-Testsuite zur Sicherheit ausführen
        run: |
          python3 scripts/test_app.py

      - name: 📦 Deployment & Service Upgrade
        run: |
          set -euo pipefail
          chmod +x deploy/upgrade.sh
          ./deploy/upgrade.sh 2>&1 | tee deploy-run.log

      - name: 📤 Deployment Logs bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: |
            deploy-run.log
            /home/berni/wunschliste/server.log
            /mnt/data/work/wunschliste/server.log
          if-no-files-found: ignore

      - name: 🩺 Smoke Test & Health Check
        run: |
          echo "Prüfe Live-Status der Wunschliste API auf dem Burkerserver..."
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8088/api/health > /dev/null; then
              echo "✔ Wunschliste läuft einwandfrei auf http://127.0.0.1:8088"
              exit 0
            fi
            echo "Warte auf Server (Versuch $i/15)..."
            sleep 2
          done
          echo "❌ Server reagiert nicht auf http://127.0.0.1:8088/api/health"
          exit 1
