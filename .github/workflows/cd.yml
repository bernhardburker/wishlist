name: CD - Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Berechtigungen für GitHub Pages Deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindere parallele Deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 GitHub Pages Veröffentlichung
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: ⚙️ GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: 📦 Build-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🌐 Auf GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
