name: CI - Qualität & Tests

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test-and-validate:
    name: 🧪 Syntax-, Modul- & Playwright E2E-Prüfung
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🚀 CI-Testsuite ausführen (Dateistruktur, ES-Module, API)
        run: |
          python3 scripts/test_app.py

      - name: 🎭 Playwright & Browser installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 🌐 Playwright E2E Browser-Tests ausführen
        run: |
          python3 scripts/test_e2e_playwright.py
