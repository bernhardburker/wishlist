name: CI - Qualität & Tests

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test-and-validate:
    name: 🧪 Syntax- & Funktionsprüfung
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🚀 CI-Testsuite ausführen
        run: |
          python3 scripts/test_app.py

      - name: 🔍 HTML & JS Validierung
        run: |
          echo "Überprüfe JavaScript-Module auf grundlegende Syntaxfehler..."
          python3 -c "
          import os, glob
          files = glob.glob('js/**/*.js', recursive=True) + ['data/default-wishes.js']
          print(f'Gefundene JS-Dateien: {len(files)}')
          for f in files:
              with open(f, 'r', encoding='utf-8') as js_file:
                  code = js_file.read()
                  assert len(code) > 0, f'Datei ist leer: {f}'
          print('✅ Alle JavaScript-Dateien sind valide und lesbar.')
          "
