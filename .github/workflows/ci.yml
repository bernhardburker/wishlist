name: CI - Qualität & Tests

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test-and-validate:
    name: 🧪 Syntax-, Modul- & Playwright E2E-Prüfung
    runs-on: self-hosted

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🚀 CI-Testsuite ausführen (Dateistruktur, ES-Module, API)
        run: |
          python3 scripts/test_app.py

      - name: 🌐 Playwright E2E Browser-Tests ausführen (Alle Kategorien)
        run: |
          python3 scripts/test_e2e_playwright.py --all
