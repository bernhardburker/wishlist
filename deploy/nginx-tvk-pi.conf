# ==============================================================================
# Nginx Reverse Proxy Konfiguration für tvk-pi
# Leitet die Subdomain (z. B. wunschliste.deinedomain.de) an den Burkerserver weiter
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name wunschliste.deinedomain.de;

    # Für Let's Encrypt Certbot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wunschliste.deinedomain.de;

    # SSL Zertifikate (anpassen an deinen Certbot Pfad)
    # ssl_certificate /etc/letsencrypt/live/wunschliste.deinedomain.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wunschliste.deinedomain.de/privkey.pem;

    # SSL Sicherheitseinstellungen
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy Weiterleitung an den Burkerserver (Port 8088)
    location / {
        # Ersetze 'burkerserver' durch die IP oder den Hostnamen deines Burkerservers im LAN
        proxy_pass http://burkerserver:8088;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout & Buffer Einstellungen
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
